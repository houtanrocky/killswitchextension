<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=440, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Kill Switch - Small Promo</title>
	<style>
		html {
			margin: 0;
			padding: 0;
			width: 440px;
			height: 280px;
			overflow: hidden;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			background-attachment: fixed;
			background-size: 100% 100%;
		}
		body {
			margin: 0;
			padding: 0;
			width: 440px;
			height: 280px;
			overflow: hidden;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			background-attachment: fixed;
			background-size: 100% 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: 'Dosis', 'Segoe UI', sans-serif;
		}
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		.content {
			text-align: center;
			color: white;
			padding: 20px;
		}
		.icon {
			font-size: 80px;
			margin-bottom: 15px;
		}
		h1 {
			font-size: 32px;
			margin-bottom: 10px;
			text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
		}
		.tagline {
			font-size: 16px;
			opacity: 0.95;
			line-height: 1.4;
		}
	</style>
</head>
<body>
	<div class="content">
		<div class="icon">🔒</div>
		<h1>Kill Switch</h1>
		<p class="tagline">Control website access<br>based on your IP address</p>
	</div>
</body>
</html>
